project:
  type: website
  output-dir: docs          # GitHub Pages: Settings > Pages > Deploy from branch > /docs
  resources:
    - images/

website:
  title: "Susan M. Kotikot"
  description: "Land use, landscape resilience and geospatial science"
  favicon: images/favicon.svg
  page-navigation: false
  navbar:
    logo: images/logo.svg
    logo-alt: "Susan M. Kotikot logo"
    title: "Understanding Landscape Change for Planning, and Resilience"
    background: "#0b1f1c"
    foreground: "#ffffff"
    left:
      - href: index.qmd
        text: Home
      - text: Research
        menu:
          - href: research.qmd
            text: "All research themes"
          - text: "---"
          - href: research.qmd#mapping-spatiotemporal-patterns-of-dynamic-landscapes
            text: "Mapping dynamic landscapes"
          - href: research.qmd#modeling-integrated-landscapes-for-social-ecological-resilience
            text: "Modeling integrated landscapes"
          - href: research.qmd#transdisciplinary-research-for-landscape-management
            text: "Research for landscape management"
      - href: software.qmd
        text: Software
      - href: publications.qmd
        text: Publications
    right:
      - icon: envelope-fill
        href: mailto:susan.kotikot@uconn.edu
        aria-label: Email
      - icon: linkedin
        href: https://www.linkedin.com/in/susankotikot
        aria-label: LinkedIn
      - icon: github
        href: https://github.com/skotikot
        aria-label: GitHub
      - icon: mortarboard-fill
        href: https://scholar.google.com/citations?user=GiHpEEsAAAAJ&hl=en
        aria-label: Google Scholar
  page-footer:
    left: "© 2026 Susan Malaso Kotikot"
    right: "Built with [Quarto](https://quarto.org) · Hosted on GitHub Pages"

format:
  html:
    theme:
      light: [cosmo, styles.scss, light.scss]
      dark: [cosmo, styles.scss, dark.scss]
    respect-user-color-scheme: true
    toc: false
    title-block-banner: true
    smooth-scroll: true
    link-external-newwindow: true
